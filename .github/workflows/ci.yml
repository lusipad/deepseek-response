name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Run tests
        run: npm test

  build-windows-exe:
    name: Build Windows executable
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Build standalone exe
        run: npm run build:exe

      - name: Smoke test standalone exe
        run: npm run smoke:exe

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath deepseek-response-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-response-windows-x64
          path: deepseek-response-windows-x64.zip
          if-no-files-found: error
