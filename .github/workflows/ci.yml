name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Run tests
        run: npm test

  build-binary:
    name: Build ${{ matrix.name }} executable
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: deepseek-response-windows-x64
            package: deepseek-response-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            artifact: deepseek-response-linux-x64
            package: deepseek-response-linux-x64.tar.gz
          - name: macOS arm64
            os: macos-latest
            artifact: deepseek-response-macos-arm64
            package: deepseek-response-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Build standalone executable
        run: npm run build:exe

      - name: Smoke test standalone executable
        id: smoke_binary
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: npm run smoke:exe

      - name: Warn on diagnostic Windows smoke failure
        if: runner.os == 'Windows' && steps.smoke_binary.outcome != 'success'
        shell: pwsh
        run: |
          Write-Warning "Windows hosted runner binary smoke failed after a successful build. The package is still uploaded for manual validation."

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.package }} -Force

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.package }}" -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
