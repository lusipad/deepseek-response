name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attach to the release
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-asset:
    name: Build ${{ matrix.name }} release asset
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: deepseek-response-windows-x64
            package: deepseek-response-windows-x64.zip
          - name: Linux x64
            os: ubuntu-latest
            artifact: deepseek-response-linux-x64
            package: deepseek-response-linux-x64.tar.gz
          - name: macOS arm64
            os: macos-latest
            artifact: deepseek-response-macos-arm64
            package: deepseek-response-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Run tests
        run: npm test

      - name: Build standalone executable
        run: npm run build:exe

      - name: Smoke test standalone executable
        id: smoke_binary
        continue-on-error: ${{ runner.os == 'Windows' }}
        run: npm run smoke:exe

      - name: Warn on diagnostic Windows smoke failure
        if: runner.os == 'Windows' && steps.smoke_binary.outcome != 'success'
        shell: pwsh
        run: |
          Write-Warning "Windows hosted runner binary smoke failed after a successful build. The release package is still uploaded for manual validation."

      - name: Package Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.package }} -Force

      - name: Package Unix release asset
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.package }}" -C dist .

      - name: Upload release asset artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-release-asset

    steps:
      - name: Download release asset artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) {
            $tag = "${{ github.ref_name }}"
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        shell: pwsh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
